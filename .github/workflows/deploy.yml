name: Build and Deploy APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set. Add it in Settings > Secrets and variables > Actions (base64-encoded contents of android/app/google-services.json)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set. Add it in Settings > Secrets and variables > Actions (base64-encoded contents of android/keystore/release_new.jks)."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keystore/release_new.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # AdMob本番IDが未設定の場合、ad_service.dart / AndroidManifest.xml は
          # Googleの公式テストIDのままビルドされる（アプリは動くが広告収益は発生しない）。
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          DART_DEFINES=()
          [ -n "$ADMOB_BANNER_ID" ] && DART_DEFINES+=(--dart-define=ADMOB_BANNER_ID="$ADMOB_BANNER_ID")
          [ -n "$ADMOB_INTERSTITIAL_ID" ] && DART_DEFINES+=(--dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID")
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          DART_DEFINES=()
          [ -n "$ADMOB_BANNER_ID" ] && DART_DEFINES+=(--dart-define=ADMOB_BANNER_ID="$ADMOB_BANNER_ID")
          [ -n "$ADMOB_INTERSTITIAL_ID" ] && DART_DEFINES+=(--dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID")
          flutter build appbundle --release "${DART_DEFINES[@]}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
